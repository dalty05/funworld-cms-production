
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funworld-cms"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0",
  "Flask-SQLAlchemy>=3.1",
  "Flask-Migrate>=4.0",
  "Flask-JWT-Extended>=4.6",
  "Flask-Cors>=4.0",
  "Flask-SocketIO>=5.3",
  "gunicorn>=23.0",
  "simple-websocket>=1.1",
  "python-socketio>=5.11",
  "python-engineio>=4.9",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "marshmallow>=3.20",
  "email-validator>=2.1",
  "phonenumbers>=8.13",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "bcrypt>=4.1",
  "markdown-it-py>=3.0",
  "bleach>=6.0",
  "weasyprint>=62.0",
  "requests>=2.31",
  "APScheduler>=3.10,<4",
  "Flask-Limiter>=3.12,<5",
  "limits>=3.9",
  "flask-talisman>=1.1",
  "celery",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-flask>=1.3",
  "ruff>=0.4",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pip-licenses>=4.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
